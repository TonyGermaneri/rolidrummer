name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Native-only changes do not change the hosted editor preview.
    paths-ignore:
      - 'native/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published, but never queue more
# than one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # `vue-tsc --noEmit` runs first, so a type error fails the deploy.
        run: npm run build

      # `enablement: true` creates (or converts) the Pages site with the "GitHub Actions" source,
      # so nobody has to remember to set it by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
